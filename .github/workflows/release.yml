name: Build and Release Binaries & Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-rust-binaries:
    name: Build Rust Binaries
    strategy:
      matrix:
        include:
          - os: windows-latest
            os_name: windows
            ext: .exe
          - os: ubuntu-latest
            os_name: linux
            ext: ''

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # Build both projects in their respective directories
      - name: Build coal
        working-directory: ./
        run: cargo build --release

      - name: Rename Binaries for Release
        # Using bash ensures this works on both Windows and Linux runners
        shell: bash
        run: |
          mv target/release/coal${{ matrix.ext }} coal-${{ github.event.inputs.version }}-${{ matrix.os_name }}${{ matrix.ext }}
          mv target/release/coal-lsp${{ matrix.ext }} coal-lsp-${{ github.event.inputs.version }}-${{ matrix.os_name }}${{ matrix.ext }}

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          generate_release_notes: true
          # Uploads both binaries to the release page
          files: |
            coal-${{ github.event.inputs.version }}-${{ matrix.os_name }}${{ matrix.ext }}
            coal-lsp-${{ github.event.inputs.version }}-${{ matrix.os_name }}${{ matrix.ext }}

      # Upload the LSP binary as a temporary pipeline artifact so the extension job can use it
      - name: Upload coal-lsp artifact for extension build
        uses: actions/upload-artifact@v4
        with:
          name: coal-lsp-${{ matrix.os_name }}
          path: coal-lsp-${{ github.event.inputs.version }}-${{ matrix.os_name }}${{ matrix.ext }}

  build-vscode-extension:
    name: Build VS Code Extension
    # This ensures the extension waits for the binaries to finish building first
    needs: build-rust-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Download the Windows LSP binary into the extension folder
      - name: Download Windows coal-lsp
        uses: actions/download-artifact@v4
        with:
          name: coal-lsp-windows
          # Adjust this path if your extension expects the binary in a specific subfolder (e.g., ./coal_extension/bin)
          path: ./coal_extension

      # Download the Linux LSP binary into the extension folder
      - name: Download Linux coal-lsp
        uses: actions/download-artifact@v4
        with:
          name: coal-lsp-linux
          path: ./coal_extension

      - name: Debug - List root files
        run: ls -la

      - name: Debug - List extension folder files
        run: ls -la ./coal_extension || echo "Folder does not exist!"

      - name: Install Dependencies and Package VSIX
        working-directory: ./coal_extension
        run: |
          npm install
          npx @vscode/vsce package

      - name: Upload VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: ./coal_extension/*.vsix