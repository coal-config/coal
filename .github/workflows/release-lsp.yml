name: Release LSP & Extension

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (patch, minor, major)'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: bump
        run: |
          LATEST_TAG=$(git tag -l "lsp-v*" | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then LATEST_TAG="lsp-v0.0.0"; fi
          
          VERSION=${LATEST_TAG#lsp-v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          
          if [ "${{ github.event.inputs.release_type }}" = "major" ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [ "${{ github.event.inputs.release_type }}" = "patch" ]; then
            PATCH=$((PATCH + 1))
          else
            MINOR=$((MINOR + 1)); PATCH=0
          fi
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          NEW_TAG="lsp-v$NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create and Push Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.bump.outputs.new_tag }}
          git push origin ${{ steps.bump.outputs.new_tag }}

  build-lsp-binaries:
    needs: versioning
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build LSP binary
        run: cargo build --release --bin coal-lsp --target ${{ matrix.target }}

      - name: Package Windows
        if: matrix.archive == 'zip'
        run: Compress-Archive -Path target\${{ matrix.target }}\release\coal-lsp.exe -DestinationPath coal-lsp-${{ needs.versioning.outputs.new_version }}-${{ matrix.target }}.zip

      - name: Package Linux
        if: matrix.archive == 'tar.gz'
        run: tar -czvf coal-lsp-${{ needs.versioning.outputs.new_version }}-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release coal-lsp

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.versioning.outputs.new_tag }}
          files: |
            *.zip
            *.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-extension:
    needs: versioning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Package VS Code Extension
        run: |
          # 1. This rewrites the package.json version cleanly without making a git commit
          npm version ${{ needs.versioning.outputs.new_version }} --no-git-tag-version
          
          # 2. Package into a .vsix file
          npx vsce package -o coal-extension-${{ needs.versioning.outputs.new_version }}.vsix

      - name: Upload Extension to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.versioning.outputs.new_tag }}
          files: "*.vsix"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}