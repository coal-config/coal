name: Release COAL Binaries

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release argument (cargo-release level)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - alpha
          - beta
          - rc
          - release

permissions:
  contents: write

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-release
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-release

      - name: Bump Version, Commit, and Tag via cargo-release
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # cargo-release will bump the Cargo.toml, commit, tag, and push to origin automatically
          cargo release ${{ github.event.inputs.release_type }} --execute --no-publish --no-confirm

          # Extract the new version from the workspace to pass to the build jobs
          # (Using jq to reliably read from cargo metadata)
          NEW_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="coal").version')
          
          # Assuming you use the default cargo-release tag format. 
          # If using release.toml with "coal-v{{version}}", change this to: NEW_TAG="coal-v$NEW_VERSION"
          NEW_TAG="coal-v$NEW_VERSION"
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

  build-and-release:
    needs: versioning
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.versioning.outputs.new_tag }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build COAL CLI
        env:
          RELEASE_VERSION: ${{ needs.versioning.outputs.new_version }}
        run: cargo build --release --bin coal --target ${{ matrix.target }}

      - name: Build COAL LSP
        env:
          RELEASE_VERSION: ${{ needs.versioning.outputs.new_version }}
        run: cargo build --release --bin coal-lsp --target ${{ matrix.target }}

      - name: Package Windows
        if: matrix.archive == 'zip'
        run: Compress-Archive -Path target\${{ matrix.target }}\release\coal.exe, target\${{ matrix.target }}\release\coal-lsp.exe -DestinationPath coal-binaries-${{ needs.versioning.outputs.new_version }}-${{ matrix.target }}.zip

      - name: Package Linux (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar -czvf coal-binaries-${{ needs.versioning.outputs.new_version }}-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release coal coal-lsp

      - name: Package Linux (Debian .deb)
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION="${{ needs.versioning.outputs.new_version }}"
          ARCH="amd64"
          DEB_DIR="coal_${VERSION}_${ARCH}"
          
          # Create directory structure
          mkdir -p ${DEB_DIR}/usr/bin
          mkdir -p ${DEB_DIR}/DEBIAN
          
          # Copy binaries to the package's bin directory
          cp target/${{ matrix.target }}/release/coal ${DEB_DIR}/usr/bin/
          cp target/${{ matrix.target }}/release/coal-lsp ${DEB_DIR}/usr/bin/
          
          # Ensure binaries are executable
          chmod +x ${DEB_DIR}/usr/bin/coal
          chmod +x ${DEB_DIR}/usr/bin/coal-lsp
          
          # Create the control file
          cat <<EOF > ${DEB_DIR}/DEBIAN/control
          Package: coal
          Version: ${VERSION}
          Architecture: ${ARCH}
          Maintainer: coal-config <coal-config@gmail.com>
          Description: COALESCENCE coal - a configuration object creator using yaml with advanced functions
          EOF
          
          # Build the package
          dpkg-deb --build ${DEB_DIR}

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.versioning.outputs.new_tag }}
          files: |
            *.zip
            *.tar.gz
            *.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
