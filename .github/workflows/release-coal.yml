name: Release COAL Binaries

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (patch, minor, major)'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: bump
        run: |
          LATEST_TAG=$(git tag -l "coal-v*" | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then 
            NEW_VERSION="0.0.1"
          else
            VERSION=${LATEST_TAG#coal-v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          
            if [ "${{ github.event.inputs.release_type }}" = "major" ]; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            elif [ "${{ github.event.inputs.release_type }}" = "patch" ]; then
              PATCH=$((PATCH + 1))
            else
              MINOR=$((MINOR + 1)); PATCH=0
            fi
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          
          NEW_TAG="coal-v$NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create and Push Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.bump.outputs.new_tag }}
          git push origin ${{ steps.bump.outputs.new_tag }}

  build-and-release:
    needs: versioning
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build COAL CLI
        env:
          RELEASE_VERSION: ${{ needs.versioning.outputs.new_version }}
        run: cargo build --release --bin coal --target ${{ matrix.target }}

      - name: Build COAL LSP
        env:
          RELEASE_VERSION: ${{ needs.versioning.outputs.new_version }}
        run: cargo build --release --bin coal-lsp --target ${{ matrix.target }}

      - name: Package Windows
        if: matrix.archive == 'zip'
        # Compress-Archive accepts an array of paths separated by commas
        run: Compress-Archive -Path target\${{ matrix.target }}\release\coal.exe, target\${{ matrix.target }}\release\coal-lsp.exe -DestinationPath coal-binaries-${{ needs.versioning.outputs.new_version }}-${{ matrix.target }}.zip

      - name: Package Linux
        if: matrix.archive == 'tar.gz'
        # tar will package both files specified at the end of the command
        run: tar -czvf coal-binaries-${{ needs.versioning.outputs.new_version }}-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release coal coal-lsp

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.versioning.outputs.new_tag }}
          files: |
            *.zip
            *.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}