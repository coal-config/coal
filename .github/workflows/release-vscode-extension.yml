name: Release VS Code Extension

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (patch, minor, major)'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: bump
        run: |
          # Changed tag prefix to ext-v to reflect this is extension only
          LATEST_TAG=$(git tag -l "ext-v*" | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then 
            NEW_VERSION="0.0.1"
          else
            VERSION=${LATEST_TAG#ext-v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          
            if [ "${{ github.event.inputs.release_type }}" = "major" ]; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            elif [ "${{ github.event.inputs.release_type }}" = "patch" ]; then
              PATCH=$((PATCH + 1))
            else
              MINOR=$((MINOR + 1)); PATCH=0
            fi
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          fi
          
          NEW_TAG="ext-v$NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create and Push Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.bump.outputs.new_tag }}
          git push origin ${{ steps.bump.outputs.new_tag }}

  build-extension:
    needs: versioning
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./coal_extension
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Package VS Code Extension
        run: |
          npm version ${{ needs.versioning.outputs.new_version }} --no-git-tag-version
          npx vsce package -o coal-extension-${{ needs.versioning.outputs.new_version }}.vsix

      - name: Upload Extension to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.versioning.outputs.new_tag }}
          files: "coal_extension/*.vsix"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}