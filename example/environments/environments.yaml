paths:
  $include:
    - ../paths.yaml
    - "./{{environment}}/paths.yaml"
node_types:
  $inherit:
    $include_subdirectories: ../node_types
    $each:
      paths:
        $override:
          $include: "./{{environment}}/paths.yaml"
  $include_subdirectories: "./{{environment}}/node_types"
nodes:
  $include_subdirectories: "./{{environment}}/nodes"
  $each:
    $inherit: "node_types.{{.type}}"